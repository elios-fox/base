name: base
description: "A Flutter base app."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.11.1

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_bloc: ^9.1.0
  equatable: ^2.0.7
  go_router: ^15.1.2
  image_picker: ^1.1.2
  intl: ^0.19.0
  supabase_flutter: ^2.8.2
  palette_generator: ^0.3.3+4
  cached_network_image: ^3.3.1
  google_fonts: ^6.2.1
  shared_preferences: ^2.3.4
  bloc_concurrency: ^0.3.0
  qr_flutter: ^4.1.0
  share_plus: ^12.0.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  bloc_test: ^10.0.0
  mocktail: ^1.0.4
  flutter_launcher_icons: ^0.14.3

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon/icon.png"
  adaptive_icon_background: "#2E7D32"
  adaptive_icon_foreground: "assets/icon/icon.png"

flutter:
  uses-material-design: true
  assets:
    - assets/icon/
