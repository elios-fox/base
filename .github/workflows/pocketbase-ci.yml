name: PocketBase CI

on:
  push:
    paths:
      - 'pb_migrations/**'
      - 'pb_hooks/**'
  pull_request:
    paths:
      - 'pb_migrations/**'
      - 'pb_hooks/**'

jobs:
  validate:
    name: Validate Migrations & Hooks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check migration file naming
        run: |
          errors=0
          for f in pb_migrations/*.js; do
            basename=$(basename "$f")
            if ! echo "$basename" | grep -qE '^[0-9]+_[a-z_]+\.js$'; then
              echo "ERROR: Invalid migration filename: $basename"
              echo "  Expected format: <timestamp>_<snake_case_name>.js"
              errors=$((errors + 1))
            fi
          done
          if [ $errors -gt 0 ]; then exit 1; fi
          echo "All migration filenames are valid."

      - name: Syntax check hooks
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: |
          for f in pb_hooks/*.js; do
            node --check "$f" || exit 1
          done
          echo "All hooks have valid syntax."
